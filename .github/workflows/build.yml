name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (scoring + parsing)
        run: ./gradlew --no-daemon :core:test

      # Same key every build so updates install over the old app. Add the repo secrets
      # KEYSTORE_BASE64, KEYSTORE_PASSWORD and KEY_ALIAS (see README). Without them a
      # throwaway key is used and each build must be installed fresh (uninstall first).
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${KEY_ALIAS:-offer-checker}" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set; signing with a throwaway key. Updates won't install over this build."
            PASS=$(openssl rand -hex 16)
            echo "::add-mask::$PASS"
            keytool -genkeypair -keystore "$KS" -alias offer-checker -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Offer Checker"
            echo "KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=offer-checker" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk nahmeter.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nahmeter-apk
          path: nahmeter.apk

      # Every build on main becomes the latest release, so the download link never changes:
      # https://github.com/<owner>/<repo>/releases/latest/download/nahmeter.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: nahmeter 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: nahmeter.apk
          body: |
            Signed APK. Install over an earlier version to keep settings and the offer log
            (requires the signing secrets to be set; see README).
            First install: follow the setup steps in the README.
